<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorteador de Times Equilibrados</title>
  <meta name="theme-color" content="#070505">
  <link rel="stylesheet" href="style.css" >
</head>
<body>
  <div class="container">
    <h1>Sorteador de Times Equilibrados</h1>

    <section id="config-section" class="card">
      <h2>Configuração</h2>
      <div class="form-group">
        <label for="lista-textarea">Cole a lista de jogadores</label>
        <textarea id="lista-textarea" rows="6" placeholder="Cole aqui a lista do WhatsApp...&#10;Ex:&#10;1. João&#10;2. Maria&#10;3. ..." spellcheck="false"></textarea>
        <p id="detected-count" class="detected-count hidden"></p>
      </div>
      <div class="form-group">
        <label for="total-jogadores">Ou digite manualmente quantos vão jogar</label>
        <input type="number" id="total-jogadores" min="5" max="60" placeholder="Ex: 20">
      </div>
      <div class="form-group">
        <label for="jogadores-por-time">Jogadores por time?</label>
        <input type="number" id="jogadores-por-time" min="2" max="11" placeholder="Ex: 5" value="5">
      </div>
      <p class="note">* Goleiros não são contados automaticamente. Se quiser incluí-los, coloque-os na lista de jogadores.</p>
      <button id="btn-proximo" class="btn btn-primary">Próximo</button>
    </section>

    <section id="jogadores-section" class="card hidden">
      <h2>Cadastrar Jogadores</h2>
      <p id="info-times"></p>
      <div id="lista-jogadores"></div>
      <button id="btn-sortear" class="btn btn-success">Sortear Times</button>
      <button id="btn-novo-jogadores" class="btn btn-primary">Novo Sorteio</button>
    </section>

    <section id="resultado-section" class="card hidden">
      <h2>Resultado</h2>
      <div id="times-container"></div>
      <button id="btn-novo" class="btn btn-primary">Novo Sorteio</button>
    </section>
  </div>

  <script src="index.js"></script>
</body>
</html>
